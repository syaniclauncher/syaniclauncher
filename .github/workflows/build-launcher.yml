name: Build launcher
# maybe windows arm support in future, if I get a laptop with arm
# linux? once after the launcher is complete
# macos? I DONT OWN A MAC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build launcher
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          $commit = git rev-parse --short HEAD
          $env:BUILD_ID = "$version`:$commit"
          wails build -platform windows/amd64 -ldflags "-X main.BUILD_ID=$env:BUILD_ID"

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: syaniclauncher-windows
          path: build/bin/syaniclauncher.exe
          if-no-files-found: error
