name: CI (Checks)

on:
  push:
  pull_request:

permissions:
  contents: read


jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.0

      - name: Vet Go packages
        run: go vet ./app ./src/...
