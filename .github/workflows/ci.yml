name: CI (Checks)

on:
  push:
  pull_request:

permissions:
  contents: read


jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npx eslint .
        working-directory: frontend

      - name: Vet Go packages
        run: go vet ./...
