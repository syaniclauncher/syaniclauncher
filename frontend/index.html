<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Syanic Launcher</title>
</head>
<body>
    <div id="overlay">
        <img src="/assets/logo.png" alt="syaniclauncher logo">
        <style>
        #overlay { position: fixed; inset: 0; z-index: 99999; display: flex; justify-content: center; align-items: center; background: var(--overlay-bg, #111); animation: breathe 2.5s ease-in-out infinite; }
        #overlay.fade-out { animation: fade-out 500ms ease forwards; }
        #overlay img { width: 200px; height: auto; }

        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        @keyframes fade-out { to { opacity: 0; visibility: hidden; } }
        </style>
    </div>

    <div id="app"></div>

    <!-- hides splash screen (when backend is ready) -->
    <script type="module" src="./src/initSplash.js"></script>

    <!-- optional: connection test module -->
    <script type="module" src="./src/test.js"></script>

    <!-- app entry -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
